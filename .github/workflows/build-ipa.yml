name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          shopt -s nullglob
          apps=(build/DerivedData/Build/Products/Debug-iphoneos/*.app)

          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "Error: no top-level .app found in Debug-iphoneos" >&2
            exit 1
          fi

          if [[ ${#apps[@]} -gt 1 ]]; then
            echo "Error: multiple top-level .app bundles found in Debug-iphoneos:" >&2
            printf '  %s\n' "${apps[@]}" >&2
            exit 1
          fi

          app_path="${apps[0]}"
          app_name="$(basename "$app_path")"
          echo "Found app: $app_path"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$app_path" "build/ipa/Payload/$app_name"
          rm -rf "build/ipa/Payload/$app_name/_CodeSignature"
          rm -f "build/ipa/Payload/$app_name/embedded.mobileprovision"

          (
            cd build/ipa
            ditto -c -k --keepParent Payload ../Reelio-iOS-unsigned.ipa
          )

          ls -lh build/Reelio-iOS-unsigned.ipa
          unzip -l build/Reelio-iOS-unsigned.ipa | sed -n '1,50p'
          unzip -Z1 build/Reelio-iOS-unsigned.ipa > build/ipa-contents.txt

          if ! grep -Fqx "Payload/$app_name/" build/ipa-contents.txt; then
            echo "Error: IPA does not contain Payload/$app_name/ at its root" >&2
            exit 1
          fi

          if ! grep -Fqx "Payload/$app_name/Info.plist" build/ipa-contents.txt; then
            echo "Error: IPA does not contain Payload/$app_name/Info.plist" >&2
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reelio-iOS-unsigned
          path: build/Reelio-iOS-unsigned.ipa
          retention-days: 7
